name: Pipeline CI/CD Kubernetes

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build, Pruebas Unitarias y Empaquetado (Maven)
        run: mvn clean package

      - name: Construir Imagen Docker
        run: docker build -t gestor-proyectos-api:latest .

      - name: Configurar Kubeconfig Local
        if: env.ACT == 'true'
        run: |
          mkdir -p ~/.kube
          cp ~/.kube-local/config ~/.kube/config || true

      - name: Desplegar en Kubernetes
        if: env.ACT == 'true'
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml